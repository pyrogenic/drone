<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #8888aa;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  canvas#viz {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.4;
  }
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 0 10px;
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #555570;
    font-weight: 300;
  }
  .top-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555570;
    background: none;
    border: 1px solid #333350;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    outline: none;
    transition: all 0.8s ease;
  }
  .ctrl-btn:hover { border-color: #555580; }
  .ctrl-btn.active { color: #6666aa; border-color: #555588; }
  #startBtn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1px solid #333350;
    background: radial-gradient(circle at 40% 40%, #1a1a2e, #0a0a15);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555570;
    transition: all 1.5s ease;
    outline: none;
  }
  #startBtn:hover {
    border-color: #555580;
    box-shadow: 0 0 30px rgba(80, 80, 140, 0.15);
  }
  #startBtn.active {
    border-color: #666690;
    box-shadow: 0 0 50px rgba(100, 100, 160, 0.2);
    background: radial-gradient(circle at 40% 40%, #22223a, #0e0e1a);
  }
  .grid-wrap {
    width: 100%;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px;
    opacity: 0;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
    scrollbar-color: #222240 transparent;
  }
  .grid-wrap::-webkit-scrollbar { width: 4px; }
  .grid-wrap::-webkit-scrollbar-track { background: transparent; }
  .grid-wrap::-webkit-scrollbar-thumb { background: #222240; border-radius: 2px; }
  .grid-wrap.visible { opacity: 1; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-bottom: 12px;
  }
  .cell {
    border: 1px solid #222240;
    border-radius: 8px;
    padding: 8px;
    transition: all 1.0s ease;
    background: rgba(15, 15, 25, 0.6);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .cell:hover { border-color: #444468; }
  .cell.listening {
    border-color: #555588;
    box-shadow: 0 0 20px rgba(90, 90, 160, 0.15);
    background: rgba(20, 20, 35, 0.8);
  }
  .cell.sticky {
    border-color: #445566;
  }
  .cell.sticky .vote-btn[data-action="up"] {
    color: #6688aa;
  }
  .cell .param-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cell .param-label {
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
  }
  /* Looks like a 2px fill bar; the input is taller than the bar so it's
     still easy to grab. --v is the fill, kept in sync on input. */
  .cell .param-slider {
    --fill: #444468;
    -webkit-appearance: none;
    appearance: none;
    width: 50%;
    height: 10px;
    margin: 0;
    background: linear-gradient(to right, var(--fill) var(--v), #1a1a30 var(--v))
      center / 100% 2px no-repeat;
    outline: none;
    cursor: ew-resize;
  }
  .cell.listening .param-slider { --fill: #6666aa; }
  .cell .param-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 6px; height: 10px;
    background: transparent;
  }
  .cell .param-slider::-moz-range-thumb {
    width: 6px; height: 10px;
    background: transparent;
    border: none;
  }
  .cell .param-slider::-moz-range-track { background: transparent; }
  .cell canvas.cell-art {
    width: 100%;
    aspect-ratio: 2 / 1;
    border-radius: 4px;
    display: block;
  }
  /* Same box as the art canvas so cells keep their height across views */
  .params-view {
    aspect-ratio: 2 / 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .vote-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 2px;
  }
  .vote-btn {
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 1px 10px;
    cursor: pointer;
    color: #444460;
    transition: all 0.4s ease;
    outline: none;
    line-height: 1;
  }
  .vote-btn:hover { color: #8888aa; border-color: #444468; }
  .cell.listening .vote-btn { color: #666688; }
  .cell.listening .vote-btn:hover { color: #aaaacc; border-color: #555588; }
  .bottom-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .bottom-row.visible { opacity: 1; }
  .hint {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333350;
  }
  .slider-control {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .slider-control label {
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444460;
    white-space: nowrap;
  }
  .slider-control input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 60px;
    height: 2px;
    background: #222240;
    outline: none;
    border-radius: 1px;
  }
  .slider-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555580;
    cursor: pointer;
  }
  .slider-control input[type="range"]::-moz-range-thumb {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555580;
    cursor: pointer;
    border: none;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(20, 20, 35, 0.92);
    border: 1px solid #333350;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8888aa;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    white-space: nowrap;
  }
  .toast.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="toast" id="toast"></div>
<div class="controls">
  <h1>Drone</h1>
  <button id="startBtn">begin</button>
  <div class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom-row" id="bottomRow">
    <button class="ctrl-btn" id="pauseBtn">pause</button>
    <button class="ctrl-btn" id="viewBtn">params</button>
    <button class="ctrl-btn" id="saveBtn">save</button>
    <button class="ctrl-btn" id="loadBtn">load</button>
    <span class="hint">+ keep, &#x2212; reroll</span>
    <div class="slider-control">
      <label>fade</label>
      <input type="range" id="fadeSlider" min="1" max="8" step="0.5" value="3">
    </div>
    <div class="slider-control">
      <label>dwell</label>
      <input type="range" id="dwellSlider" min="6" max="30" step="1" value="12">
    </div>
  </div>
</div>
<input type="file" id="loadFile" accept=".json" style="display:none">

<script>
const $ = id => document.getElementById(id);
const NUM_CELLS = 8;
const PARAM_NAMES = ['ground', 'color', 'beat', 'glow', 'air', 'sing', 'pluck'];
// The params that shape the voicing and the identicon. pluck was added later
// and stays out of these so existing cells keep their sound and art.
const SHAPE_PARAMS = ['ground', 'color', 'beat', 'glow', 'air', 'sing'];
const STORAGE_KEY = 'drone-state-v4';

let ctx, running = false, paused = false;
let masterGain, noiseBuf;
let viewMode = 'art'; // 'art' or 'params'
let fadeTime = 3;   // morph time constant, seconds
let dwellTime = 12; // seconds per cell
let variations = [];
let currentListening = 0;
let cycleTimer = null;
let artAnimId = null;
let engine = null;
let root = null;     // session root, Hz — every cell is built on it
let voiceSeed = null; // fixes each voice's pan/motion/variety for the session

// Low roots so the drone has a floor: A1, B1, C2, D2.
const ROOTS = [55.00, 61.74, 65.41, 73.42];

// Harmonics of the root in just intonation. cx is how far up the ladder a
// voice sits; the color param opens the ladder from open fifths toward
// thirds, sevenths and the 11th harmonic.
const VOICE_BANK = [
  { ratio: 1,    cx: 0 },    // root
  { ratio: 3/2,  cx: 0 },    // fifth
  { ratio: 2,    cx: 0 },    // octave
  { ratio: 3,    cx: 0.15 }, // fifth, up an octave
  { ratio: 4,    cx: 0.2 },  // two octaves
  { ratio: 6,    cx: 0.3 },  // fifth, two up
  { ratio: 5/2,  cx: 0.4 },  // major third (5/4)
  { ratio: 5,    cx: 0.45 },
  { ratio: 9/2,  cx: 0.55 }, // ninth (9/8)
  { ratio: 15/4, cx: 0.7 },  // major seventh (15/8)
  { ratio: 7/2,  cx: 0.75 }, // harmonic seventh (7/4)
  { ratio: 7,    cx: 0.8 },
  { ratio: 11/4, cx: 0.95 }, // 11th harmonic, between fourth and tritone
];

// --- State persistence ---

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      variations, currentListening, paused, viewMode, fadeTime, dwellTime, root, voiceSeed
    }));
  } catch(e) {}
}

// chimes became sing (carry the old value over); pluck arrived later (off)
function migrateVariations(vs) {
  vs.forEach(v => {
    if (v.sing === undefined) { v.sing = v.chimes || 0; delete v.chimes; }
    if (v.pluck === undefined) v.pluck = 0;
  });
  return vs;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.variations && s.variations.length === NUM_CELLS) return s;
  } catch(e) {}
  return null;
}

// --- Variations ---

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function mutate(base, amount) {
  const result = {};
  for (const k of PARAM_NAMES) {
    result[k] = clamp01(base[k] + (Math.random() - 0.5) * amount);
  }
  return result;
}

function generateChain() {
  // Start from a random seed, each cell is a subtle mutation of the previous
  variations = [];
  let current = {
    ground: 0.2 + Math.random() * 0.6,
    color:  0.1 + Math.random() * 0.6,
    beat:   0.1 + Math.random() * 0.6,
    glow:   0.1 + Math.random() * 0.6,
    air:    0.1 + Math.random() * 0.6,
    sing:   0.1 + Math.random() * 0.5,
    pluck:  Math.random() * 0.6
  };
  // Each step moves every param by up to +/-0.175: neighbors are related but
  // the far end of the chain is clearly somewhere else.
  for (let i = 0; i < NUM_CELLS; i++) {
    current = (i === 0) ? { ...current } : mutate(current, 0.35);
    variations.push({ ...current });
  }
}

// --- Build DOM ---

function buildGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  for (let i = 0; i < NUM_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    grid.appendChild(cell);
  }
  renderCells();
}

function renderCells() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    const v = variations[i];
    if (!v) return;
    if (viewMode === 'params') {
      cell.innerHTML = `
        <div class="params-view">
          ${PARAM_NAMES.map(p => `
            <div class="param-row">
              <span class="param-label">${p}</span>
              <input type="range" class="param-slider" min="0" max="1" step="0.01"
                value="${v[p]}" data-idx="${i}" data-param="${p}" style="--v: ${v[p] * 100}%">
            </div>
          `).join('')}
        </div>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    } else {
      cell.innerHTML = `
        <canvas class="cell-art" data-idx="${i}" width="160" height="80"></canvas>
        <div class="vote-row">
          <button class="vote-btn" data-action="down" data-idx="${i}">&#x2212;</button>
          <button class="vote-btn" data-action="up" data-idx="${i}">+</button>
        </div>
      `;
    }
  });
  if (viewMode === 'art') drawAllArt();
}

// --- Procedural art per cell ---
// Each cell gets a deterministic-ish visual based on its 4 params.
// We use a seeded approach: hash the params to get a seed, then draw.

// Deterministic pseudo-random from a seed
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// Smooth pseudo-random field over param space: each identicon square is on or
// off depending on a sine of a fixed random projection of the params, so
// nearby params draw nearby pictures and the art differs only as much as the
// sound does.
const ART_FIELD = (() => {
  const r = seededRand(1337);
  const proj = () => SHAPE_PARAMS.map(() => (r() * 2 - 1) * 2.5);
  return Array.from({ length: 25 }, () => ({
    phase: r(), k: proj(), cphase: r(), ck: proj(), jitter: r()
  }));
})();

function artField(phase, k, params) {
  let d = phase;
  SHAPE_PARAMS.forEach((p, j) => { d += k[j] * params[p]; });
  return 0.5 + 0.5 * Math.sin(2 * Math.PI * d);
}

function drawCellArt(canvas, params, isListening, time) {
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  const { ground, sing } = params;
  const density = params.color, shimmer = params.glow, breath = params.air, drift = params.beat;

  // Deterministic seed from params (quantized so similar params = similar art)
  const q = 40; // quantization level
  const seedVal = (Math.round(ground * q) * 1000000000
    + Math.round(density * q) * 10000000
    + Math.round(shimmer * q) * 100000
    + Math.round(breath * q) * 1000
    + Math.round(drift * q) * 10
    + Math.round((sing || 0) * q));
  const rand = seededRand(seedVal + 1);

  // Background
  c.fillStyle = '#0c0c16';
  c.fillRect(0, 0, w, h);

  // Color palette derived from params
  const baseHue = (1 - ground) * 280 + 180; // deep drones sit at the cool end
  const hue2 = baseHue + 30 + shimmer * 60;
  const hue3 = baseHue - 20 - breath * 40;
  const sat = 35 + shimmer * 35;
  const baseLum = isListening ? 50 : 35;

  // Identicon grid: 10 cols (5 mirrored) x 5 rows
  const cols = 10, halfCols = 5, rows = 5;
  const cellW = w / cols, cellH = h / rows;

  // Generate left half, mirror to right
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < halfCols; gx++) {
      const f = ART_FIELD[gy * halfCols + gx];
      // Density controls how many cells are filled
      const threshold = 0.3 + (1 - density) * 0.35;
      if (artField(f.phase, f.k, params) > threshold) {
        // Pick from palette
        const colorChoice = artField(f.cphase, f.ck, params);
        let hue, lum, alpha;
        if (colorChoice < 0.45) {
          hue = baseHue;
          lum = baseLum + f.jitter * 15;
          alpha = isListening ? 0.7 : 0.45;
        } else if (colorChoice < 0.75) {
          hue = hue2;
          lum = baseLum - 5 + f.jitter * 20;
          alpha = isListening ? 0.55 : 0.35;
        } else {
          hue = hue3;
          lum = baseLum + 5 + f.jitter * 10;
          alpha = isListening ? 0.5 : 0.3;
        }

        const fill = `hsla(${hue}, ${sat}%, ${lum}%, ${alpha})`;
        // Draw on left side
        c.fillStyle = fill;
        c.fillRect(gx * cellW, gy * cellH, cellW - 0.5, cellH - 0.5);
        // Mirror on right side
        c.fillRect((cols - 1 - gx) * cellW + 0.5, gy * cellH, cellW - 0.5, cellH - 0.5);
      }
    }
  }

  // Breath overlay: soft animated glow
  const glowAlpha = 0.03 + breath * 0.06;
  const gx = w * 0.5 + Math.sin(time * 0.4) * w * 0.15 * drift;
  const gy = h * 0.5 + Math.cos(time * 0.3) * h * 0.2 * breath;
  const grad = c.createRadialGradient(gx, gy, 0, gx, gy, w * 0.6);
  grad.addColorStop(0, `hsla(${baseHue}, ${sat}%, 60%, ${glowAlpha})`);
  grad.addColorStop(1, 'transparent');
  c.fillStyle = grad;
  c.fillRect(0, 0, w, h);

  // Shimmer: occasional bright pixels that twinkle
  if (shimmer > 0.2) {
    const sparkCount = Math.floor(shimmer * 8);
    for (let i = 0; i < sparkCount; i++) {
      const phase = Math.sin(time * 2 + i * 1.7 + seedVal * 0.001);
      if (phase > 0.3) {
        const sx = rand() * w;
        const sy = rand() * h;
        c.fillStyle = `hsla(${baseHue + 40}, 50%, 80%, ${phase * 0.3})`;
        c.fillRect(sx, sy, 2, 2);
      }
    }
  }

  // Pluck: four faint strings that brighten in turn and shiver
  const pluckVal = params.pluck || 0;
  if (pluckVal > 0.05) {
    for (let i = 0; i < 4; i++) {
      const pulse = Math.max(0, Math.sin(time * 1.3 - i * Math.PI / 2));
      const x = w * (0.2 + i * 0.2) + Math.sin(time * 23 + i) * pulse * pluckVal;
      const alpha = pluckVal * (isListening ? 0.12 + pulse * 0.25 : 0.06 + pulse * 0.08);
      c.fillStyle = `hsla(${baseHue + 20}, 40%, 75%, ${alpha})`;
      c.fillRect(x, 0, 1, h);
    }
  }

  // Sing: small bright diamond shapes, scattered
  const singVal = sing || 0;
  if (singVal > 0.1) {
    const chimeCount = Math.floor(singVal * 6);
    for (let i = 0; i < chimeCount; i++) {
      const cx = rand() * w;
      const cy = rand() * h;
      const phase = Math.sin(time * 3 + i * 2.3 + seedVal * 0.002);
      const size = 2 + phase * 1.5;
      const alpha = isListening ? 0.4 + phase * 0.3 : 0.15 + phase * 0.1;
      if (alpha > 0.1) {
        c.save();
        c.translate(cx, cy);
        c.rotate(Math.PI / 4);
        c.fillStyle = `hsla(${baseHue + 80}, 60%, 75%, ${alpha})`;
        c.fillRect(-size / 2, -size / 2, size, size);
        c.restore();
      }
    }
  }
}

function drawAllArt() {
  const canvases = document.querySelectorAll('canvas.cell-art');
  const time = performance.now() / 1000;
  canvases.forEach(canvas => {
    const idx = parseInt(canvas.dataset.idx);
    if (variations[idx]) {
      drawCellArt(canvas, variations[idx], idx === currentListening, time);
    }
  });
}

function startArtLoop() {
  cancelAnimationFrame(artAnimId);
  function loop() {
    if (!running) return;
    if (viewMode === 'art') drawAllArt();
    artAnimId = requestAnimationFrame(loop);
  }
  loop();
}

// --- Audio engine ---
// One engine runs for the whole session. Every voice is a harmonic of a single
// root and stays alive; a cell is just a set of targets, and moving between
// cells glides every voice toward the new targets. Nothing is created or torn
// down on a cell change, so transitions are morphs rather than crossfades.

function makeNoise(audioCtx) {
  // Pink noise (Paul Kellet's filter): softer and warmer than white.
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, peak = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
      b6 = w * 0.115926;
      peak = Math.max(peak, Math.abs(data[i]));
    }
    for (let i = 0; i < len; i++) data[i] /= peak;
  }
  return buf;
}

function makeReverbIR(audioCtx, seconds) {
  // Exponentially decaying stereo noise that darkens as it decays: a cheap
  // stand-in for a large, soft room.
  const rate = audioCtx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = audioCtx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const k = 0.6 - 0.55 * t; // one-pole lowpass closes over the tail
      lp += k * ((Math.random() * 2 - 1) - lp);
      data[i] = lp * Math.pow(1 - t, 2.5) * Math.exp(-t * 3);
    }
  }
  return buf;
}

function makeVoiceWave(audioCtx) {
  // Saw-like harmonic stack; each voice's lowpass decides how much of it shows.
  const n = 12;
  const real = new Float32Array(n + 1);
  const imag = new Float32Array(n + 1);
  for (let k = 1; k <= n; k++) imag[k] = 1 / k;
  return audioCtx.createPeriodicWave(real, imag);
}

function smooth01(x) {
  const t = clamp01(x);
  return t * t * (3 - 2 * t);
}

const MAX_RATIO_LOG = Math.log2(7);

function voiceWeight(v, params) {
  // color opens the just-intonation ladder: low color is root/fifth/octave,
  // high color lets in thirds, sevenths, the 11th harmonic.
  const gate = smooth01((params.color + 0.2 - v.cx) / 0.2);
  // ground tilts the bank: high ground leans on the low harmonics.
  const pos = Math.log2(v.ratio) / MAX_RATIO_LOG;
  const center = 1 - params.ground;
  const tilt = 0.25 + 0.75 * Math.exp(-((pos - center) ** 2) / (2 * 0.35 * 0.35));
  // A smooth per-voice function of all params, so nearby cells sound nearby
  // but the param space still has variety beyond the named axes.
  let vary = 1;
  if (v.proj) {
    let d = v.phase;
    SHAPE_PARAMS.forEach((p, j) => { d += v.proj[j] * params[p]; });
    vary = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(2 * Math.PI * d));
  }
  return gate * tilt * vary;
}

// Harmonics the singer may land on. color opens the same ladder the voices
// use: open fifths and octaves first, then thirds, sevenths, the 11th.
function overtonePool(color) {
  const pool = [6, 8, 9, 12, 16];
  if (color > 0.35) pool.push(5, 10, 15);
  if (color > 0.7) pool.push(7, 14);
  if (color > 0.9) pool.push(11, 13);
  return pool.sort((a, b) => a - b);
}

function createSinger(root, dest, getParams) {
  // Overtone singing: a bright tone on the root, with one harmonic at a time
  // picked out by two narrow bandpasses that glide between them. The melody
  // comes from inside the drone, so it is always in tune with it.
  const n = 24;
  const real = new Float32Array(n + 1);
  const imag = new Float32Array(n + 1);
  for (let k = 1; k <= n; k++) imag[k] = 1 / Math.sqrt(k);
  const src = ctx.createOscillator();
  src.setPeriodicWave(ctx.createPeriodicWave(real, imag));
  src.frequency.value = root;

  const bands = [0, 1].map(() => {
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = root * 8;
    bp.Q.value = 20;
    return bp;
  });
  const amp = ctx.createGain();
  amp.gain.value = 0;
  const pan = ctx.createStereoPanner();

  src.connect(bands[0]);
  bands[0].connect(bands[1]);
  bands[1].connect(amp);
  amp.connect(pan);
  pan.connect(dest);
  src.start();

  let harmonic = 8;
  let singing = false;
  let notesLeft = 0;
  let timer = null;
  const level = p => 0.5 * Math.pow(p.sing, 0.8);

  function step() {
    if (!running) return;
    const p = getParams();
    const now = ctx.currentTime;

    if (!p || p.sing < 0.05) {
      amp.gain.setTargetAtTime(0, now, 1.5);
      singing = false;
      notesLeft = 0;
      timer = setTimeout(step, 3000);
      return;
    }

    if (notesLeft <= 0) {
      if (singing) {
        // End of a phrase: breathe. More sing, shorter rests.
        singing = false;
        amp.gain.setTargetAtTime(0, now, 1.5);
        timer = setTimeout(step, (4 + Math.random() * 10) * (1.3 - p.sing) * 1000);
        return;
      }
      singing = true;
      notesLeft = 3 + Math.floor(Math.random() * 5);
    }

    // Mostly stepwise through the pool, sometimes a skip.
    const pool = overtonePool(p.color);
    let i = pool.reduce((best, h, j) =>
      Math.abs(h - harmonic) < Math.abs(pool[best] - harmonic) ? j : best, 0);
    const r = Math.random();
    i += r < 0.35 ? -1 : r < 0.7 ? 1 : r < 0.85 ? -2 : 2;
    if (i < 0) i = -i;
    if (i >= pool.length) i = 2 * (pool.length - 1) - i;
    harmonic = pool[Math.max(0, i)];

    const glide = 0.2 + Math.random() * 0.5;
    bands.forEach(bp => {
      bp.frequency.setTargetAtTime(root * harmonic, now, glide);
      bp.Q.setTargetAtTime(2.5 * harmonic, now, glide);
    });
    pan.pan.setTargetAtTime((Math.random() - 0.5) * 0.6, now, 3);
    amp.gain.setTargetAtTime(level(p), now, 0.8);
    notesLeft--;
    timer = setTimeout(step, (1.5 + Math.random() * 3.5) * 1000);
  }

  return {
    start() { timer = setTimeout(step, 2000); },
    stop() {
      clearTimeout(timer);
      try { src.stop(); } catch(e) {}
    }
  };
}

function createBreathLayer(audioCtx, dest, freq, q, targetGain, wander) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = q;

  const gain = audioCtx.createGain();
  gain.gain.value = 0;

  const pan = audioCtx.createStereoPanner();
  pan.pan.value = (Math.random() * 2 - 1) * 0.8;

  src.connect(bp);
  bp.connect(gain);
  gain.connect(pan);
  pan.connect(dest);
  src.start(audioCtx.currentTime, Math.random() * 4);

  return { src, bp, gain, pan, targetGain, wander };
}

function createTanpura(root, dest, getParams) {
  // Four plucked strings in the classic pa-sa-sa-SA turn. Each pluck is a
  // bright harmonic tone whose resonant bump sweeps upward after the attack,
  // a stand-in for the jawari bridge's blooming buzz. Pitches are exact
  // multiples of the root, so the strings sit inside the drone.
  const n = 32;
  const real = new Float32Array(n + 1);
  const imag = new Float32Array(n + 1);
  for (let k = 1; k <= n; k++) imag[k] = 1 / Math.pow(k, 0.7);
  const wave = ctx.createPeriodicWave(real, imag);
  const pans = [-0.25, -0.08, 0.08, 0.25];
  let timer = null;
  let nextAt = 0;

  function pluck(freq, when, level, panPos) {
    const osc = ctx.createOscillator();
    osc.setPeriodicWave(wave);
    osc.frequency.value = freq;

    const buzz = ctx.createBiquadFilter();
    buzz.type = 'peaking';
    buzz.Q.value = 4;
    buzz.gain.value = 12;
    buzz.frequency.setValueAtTime(freq * 3, when);
    buzz.frequency.exponentialRampToValueAtTime(
      Math.min(4000, freq * (14 + Math.random() * 6)), when + 2 + Math.random());

    const body = ctx.createBiquadFilter();
    body.type = 'lowpass';
    body.Q.value = 0.5;
    body.frequency.setValueAtTime(Math.min(8000, freq * 12), when);
    body.frequency.setTargetAtTime(freq * 4, when, 2);

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, when);
    amp.gain.linearRampToValueAtTime(level, when + 0.01);
    amp.gain.setTargetAtTime(0, when + 0.05, 2.5);

    const pan = ctx.createStereoPanner();
    pan.pan.value = panPos;

    osc.connect(buzz);
    buzz.connect(body);
    body.connect(amp);
    amp.connect(pan);
    pan.connect(dest);
    osc.start(when);
    osc.stop(when + 14);
  }

  function turn() {
    if (!running) return;
    const p = getParams();
    const now = ctx.currentTime;
    if (nextAt < now + 0.05) nextAt = now + 0.1;
    const span = 4.4 + Math.random() * 0.8;
    if (p && p.pluck > 0.05) {
      // First string is pa (a fifth under sa); high color retunes it to ni.
      const first = p.color > 0.85 ? root * 15 / 8 : root * 3 / 2;
      const strings = [first, root * 2, root * 2, root];
      const level = 0.12 * Math.pow(p.pluck, 0.8);
      strings.forEach((f, k) => {
        const when = nextAt + k * span / 4 + (Math.random() - 0.5) * 0.06;
        pluck(f, when, level * (k === 3 ? 1.3 : 1), pans[k]);
      });
    }
    nextAt += span;
    timer = setTimeout(turn, Math.max(100, (nextAt - ctx.currentTime - 0.5) * 1000));
  }

  return {
    start() { timer = setTimeout(turn, 1000); },
    stop() { clearTimeout(timer); }
  };
}

function createEngine(root, seed) {
  const bus = ctx.createGain();
  bus.connect(masterGain);
  const rand = seededRand(seed);
  // Separate stream for later additions, so the original draws (and so the
  // sound of saved cells) stay put.
  const rand2 = seededRand((seed % 2147483000) + 7);
  const wave = makeVoiceWave(ctx);
  const startAt = ctx.currentTime;

  const voices = VOICE_BANK.map((def, i) => {
    const freq = root * def.ratio;
    const pos = Math.log2(def.ratio) / MAX_RATIO_LOG;
    // Two oscillators per voice, split by the beat rate: their interference
    // is the slow flutter drone music runs on.
    const oscA = ctx.createOscillator();
    const oscB = ctx.createOscillator();
    oscA.setPeriodicWave(wave);
    oscB.setPeriodicWave(wave);
    oscA.frequency.value = freq;
    oscB.frequency.value = freq;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = freq * 1.5;
    filter.Q.value = 0.5;

    const amp = ctx.createGain();   // morph target level
    amp.gain.value = 0;
    const wob = ctx.createGain();   // slow independent swell, 0.7..1.3
    wob.gain.value = 1;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.012 + rand() * 0.05;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.3;
    lfo.connect(lfoDepth);
    lfoDepth.connect(wob.gain);

    const pan = ctx.createStereoPanner();
    pan.pan.value = (rand() * 2 - 1) * (0.1 + 0.7 * pos);

    // A slow resonant bump drifting across this voice's 2nd-8th harmonics,
    // so its overtones rise and fall on their own. glow decides how much of
    // it gets past the lowpass.
    const dance = ctx.createBiquadFilter();
    dance.type = 'peaking';
    dance.frequency.value = freq * 5;
    dance.Q.value = 3;
    dance.gain.value = 9;

    oscA.connect(dance);
    oscB.connect(dance);
    dance.connect(filter);
    filter.connect(amp);
    amp.connect(wob);
    wob.connect(pan);
    pan.connect(bus);
    oscA.start(startAt);
    oscB.start(startAt);
    lfo.start(startAt + rand() * 10);

    // Root and fifth are the floor; they only respond to the named axes.
    const proj = i < 2 ? null : SHAPE_PARAMS.map(() => (rand() * 2 - 1) * 1.2);
    return {
      ...def, freq, oscA, oscB, filter, amp, lfo, dance, proj,
      danceRate: 0.006 + rand2() * 0.025,
      dancePhase: rand2(),
      phase: rand(),
      beatScale: 0.5 + rand(),
    };
  });

  // Air: pink noise through narrow bands parked on the root's harmonics, so
  // the wind whistles in key, plus one low, broad band for body.
  const breaths = [
    createBreathLayer(ctx, bus, root * 8, 9, 0.5, true),
    createBreathLayer(ctx, bus, root * 12, 9, 0.5, true),
    createBreathLayer(ctx, bus, root * 16, 9, 0.5, true),
    createBreathLayer(ctx, bus, root * 4, 1.2, 0.08, false),
  ];
  let current = null;
  const singer = createSinger(root, bus, () => current);
  const tanpura = createTanpura(root, bus, () => current);
  let evolveId = null;

  // Drift each voice's overtone bump with plain value writes rather than an
  // LFO: modulating a biquad's frequency at audio rate makes the browser
  // recompute its coefficients every sample, which nearly ate a whole core.
  const danceId = setInterval(() => {
    const t = ctx.currentTime;
    voices.forEach(v => {
      v.dance.frequency.value =
        v.freq * (5 + 3 * Math.sin(2 * Math.PI * (v.danceRate * t + v.dancePhase)));
    });
  }, 250);

  function morphTo(params, tau) {
    current = params;
    const now = ctx.currentTime;
    const weights = voices.map(v => voiceWeight(v, params));
    const total = weights.reduce((a, b) => a + b, 0);
    const norm = 0.14 / Math.pow(Math.max(1, total), 0.6);
    // beat: 0.03 Hz (barely moving) .. 2.5 Hz (audible flutter)
    const beatHz = 0.03 * Math.pow(2.5 / 0.03, params.beat);
    const bright = 1.2 + params.glow * params.glow * 7;

    voices.forEach((v, i) => {
      const b = beatHz * v.beatScale;
      v.oscA.frequency.setTargetAtTime(v.freq + b / 2, now, tau);
      v.oscB.frequency.setTargetAtTime(v.freq - b / 2, now, tau);
      v.filter.frequency.setTargetAtTime(Math.min(12000, v.freq * bright), now, tau);
      v.amp.gain.setTargetAtTime(weights[i] * norm, now, tau);
    });
    breaths.forEach(n => {
      n.gain.gain.setTargetAtTime(n.targetGain * params.air, now, tau);
    });
  }

  function evolve() {
    if (!running || !current) return;
    const now = ctx.currentTime;

    breaths.forEach(n => {
      // Now and then a whistle moves to another harmonic, then sits on it.
      if (n.wander && Math.random() < 0.25) {
        const pool = overtonePool(current.color);
        const h = pool[Math.floor(Math.random() * pool.length)] * (Math.random() < 0.4 ? 2 : 1);
        n.bp.frequency.setTargetAtTime(Math.min(4000, root * h), now, 2 + Math.random() * 2);
      }
      const newPan = Math.max(-1, Math.min(1, n.pan.pan.value + (Math.random() - 0.5) * 0.3));
      n.pan.pan.setTargetAtTime(newPan, now, 5);
    });

    evolveId = setTimeout(evolve, 3000 + Math.random() * 4000);
  }

  return {
    morphTo,
    start(params, tau) { morphTo(params, tau); evolve(); singer.start(); tanpura.start(); },
    destroy() {
      clearTimeout(evolveId);
      clearInterval(danceId);
      singer.stop();
      tanpura.stop();
      bus.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
      setTimeout(() => {
        voices.forEach(v => {
          try { v.oscA.stop(); v.oscB.stop(); v.lfo.stop(); } catch(e) {}
        });
        breaths.forEach(b => { try { b.src.stop(); } catch(e) {} });
        try { bus.disconnect(); } catch(e) {}
      }, 3000);
    }
  };
}

// --- Orchestration ---

let unlockAudio = null;

function unlockIOSAudio() {
  // iOS respects the silent switch for WebAudio unless the page is in the
  // "media playback" audio category. Playing a silent <audio> element on a
  // user gesture flips the category so our drone plays through the speaker
  // even with the ringer switch on.
  //
  // The clip must have real length: looping a WAV with zero samples (what
  // this used to do) makes Chrome spin at ~200% CPU, forever, even after
  // the drone is ended. One element, half a second of silence, reused.
  if (!unlockAudio) {
    const rate = 8000, n = rate / 2;
    const bytes = new ArrayBuffer(44 + n * 2); // samples stay zero: silence
    const v = new DataView(bytes);
    const tag = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
    tag(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE');
    tag(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    tag(36, 'data'); v.setUint32(40, n * 2, true);
    unlockAudio = document.createElement('audio');
    unlockAudio.setAttribute('playsinline', '');
    unlockAudio.loop = true;
    unlockAudio.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  }
  unlockAudio.play().catch(() => {});
}

function init() {
  unlockIOSAudio();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  noiseBuf = makeNoise(ctx);

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  // Only clear out sub-audible rumble; the root lives at 55-73 Hz.
  const masterHP = ctx.createBiquadFilter();
  masterHP.type = 'highpass';
  masterHP.frequency.value = 28;

  const reverbMix = ctx.createGain();
  reverbMix.gain.value = 0.45;
  const dryMix = ctx.createGain();
  dryMix.gain.value = 0.7;

  const reverb = ctx.createConvolver();
  reverb.buffer = makeReverbIR(ctx, 9);
  masterGain.connect(reverb);
  reverb.connect(reverbMix);
  masterGain.connect(dryMix);

  // Gentle glue only — a drone shouldn't pump.
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.ratio.value = 2.5;
  comp.attack.value = 0.3;
  comp.release.value = 1.0;

  dryMix.connect(comp);
  reverbMix.connect(comp);
  comp.connect(masterHP);
  masterHP.connect(ctx.destination);

  if (variations.length !== NUM_CELLS) generateChain();
  if (!root) root = ROOTS[Math.floor(Math.random() * ROOTS.length)];
  if (!voiceSeed) voiceSeed = 1 + Math.floor(Math.random() * 2147483645);
  buildGrid();
  startEngine();
  if (!paused) startCycling();
  startVisualization();
  startArtLoop();
}

function startEngine() {
  if (engine) engine.destroy();
  engine = createEngine(root, voiceSeed);
  engine.start(variations[currentListening], 3);
  highlightSlot(currentListening);
}

function highlightSlot(idx) {
  currentListening = idx;
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === idx));
  if (engine) engine.morphTo(variations[idx], fadeTime);
  updateStickyClasses();
  const activeCell = cells[idx];
  if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  saveState();
}

function startCycling() {
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    highlightSlot((currentListening + 1) % NUM_CELLS);
  }, dwellTime * 1000);
}

// Upvote: mark sticky, gently regenerate 2-3 nearest non-sticky neighbors
function selectVariation(idx) {
  variations[idx].sticky = true;

  // Determine which neighbors to regenerate (up to 2 in each direction, skip sticky)
  const toRegen = [];
  for (let d = 1; d <= 3; d++) {
    const fwd = idx + d, bck = idx - d;
    if (fwd < NUM_CELLS && !variations[fwd].sticky) toRegen.push(fwd);
    if (bck >= 0 && !variations[bck].sticky) toRegen.push(bck);
  }

  for (const i of toRegen) {
    // Mutate from nearest neighbor toward the upvoted cell
    const toward = i < idx ? i + 1 : i - 1;
    const dist = Math.abs(i - idx);
    variations[i] = mutate(variations[toward], 0.15 + dist * 0.08);
  }

  renderCells();
  updateStickyClasses();
  saveState();

  if (toRegen.includes(currentListening)) engine.morphTo(variations[currentListening], fadeTime);
  if (!paused) startCycling();
}

// Downvote: reroll this cell from neighbor (unless sticky — unstick first)
function rejectVariation(idx) {
  // First tap on sticky: just unstick, keep the sound
  if (variations[idx].sticky) {
    variations[idx].sticky = false;
    updateStickyClasses();
    saveState();
    return;
  }

  // Mutate from nearest neighbor
  const neighbor = idx > 0 ? variations[idx - 1] : variations[idx + 1];
  variations[idx] = mutate(neighbor, 0.4);
  renderCells();
  updateStickyClasses();
  saveState();

  if (currentListening === idx) engine.morphTo(variations[idx], fadeTime);

  // Reset cycle timer so user gets full listen time
  if (!paused) startCycling();
}

function updateStickyClasses() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    cell.classList.toggle('sticky', !!(variations[i] && variations[i].sticky));
  });
}

// --- Event delegation ---

$('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.vote-btn');
  if (!btn || !running) return;
  const idx = parseInt(btn.dataset.idx);
  if (btn.dataset.action === 'up') selectVariation(idx);
  else rejectVariation(idx);
});

// Dragging a param edits that cell in place: it becomes the one playing,
// is kept (sticky), and the engine follows the slider closely.
$('grid').addEventListener('input', (e) => {
  const slider = e.target.closest('.param-slider');
  if (!slider || !running) return;
  const idx = parseInt(slider.dataset.idx);
  variations[idx][slider.dataset.param] = parseFloat(slider.value);
  slider.style.setProperty('--v', `${slider.value * 100}%`);
  variations[idx].sticky = true;
  if (currentListening !== idx) highlightSlot(idx);
  else engine.morphTo(variations[idx], 0.4);
  if (!paused) startCycling();
  updateStickyClasses();
  saveState();
});

// --- Background visualization ---

function startVisualization() {
  const canvas = $('viz');
  const c = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 2 + 0.5, alpha: Math.random() * 0.3
    });
  }

  function draw() {
    if (!running) return;
    c.fillStyle = 'rgba(10, 10, 15, 0.08)';
    c.fillRect(0, 0, w, h);

    const cur = variations[currentListening] || { air: 0.5, glow: 0.3 };

    particles.forEach(p => {
      p.x += p.vx + (Math.random() - 0.5) * 0.2 * cur.air;
      p.y += p.vy + (Math.random() - 0.5) * 0.15;
      p.alpha += (Math.random() - 0.5) * 0.02;
      p.alpha = Math.max(0.02, Math.min(0.25 + cur.glow * 0.15, p.alpha));

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(120, 120, 180, ${p.alpha})`;
      c.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
}

// --- Controls ---

function showSilentSwitchHintIfNeeded() {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (!isMobile) return;
  if (localStorage.getItem('drone-silent-hint-shown')) return;
  const t = $('toast');
  t.textContent = 'no sound? check silent switch';
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 5000);
  try { localStorage.setItem('drone-silent-hint-shown', '1'); } catch(e) {}
}

$('startBtn').addEventListener('click', () => {
  if (!running) {
    running = true;
    $('startBtn').textContent = 'end';
    $('startBtn').classList.add('active');
    $('gridWrap').classList.add('visible');
    $('bottomRow').classList.add('visible');
    showSilentSwitchHintIfNeeded();
    const saved = loadState();
    if (saved) {
      variations = migrateVariations(saved.variations);
      currentListening = saved.currentListening || 0;
      root = saved.root || null;
      voiceSeed = saved.voiceSeed || null;
      paused = saved.paused;
      viewMode = saved.viewMode || 'art';
      fadeTime = saved.fadeTime || 3;
      dwellTime = saved.dwellTime || 12;
    }
    $('pauseBtn').textContent = paused ? 'cycle' : 'pause';
    $('pauseBtn').classList.toggle('active', paused);
    $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
    $('fadeSlider').value = fadeTime;
    $('dwellSlider').value = dwellTime;
    init();
  } else {
    running = false;
    $('startBtn').textContent = 'begin';
    $('startBtn').classList.remove('active');
    $('gridWrap').classList.remove('visible');
    $('bottomRow').classList.remove('visible');
    clearInterval(cycleTimer);
    cancelAnimationFrame(artAnimId);
    if (engine) { engine.destroy(); engine = null; }
    if (unlockAudio) unlockAudio.pause();
    if (ctx) { ctx.close(); ctx = null; }
  }
});

$('pauseBtn').addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearInterval(cycleTimer);
    $('pauseBtn').textContent = 'cycle';
    $('pauseBtn').classList.add('active');
  } else {
    startCycling();
    $('pauseBtn').textContent = 'pause';
    $('pauseBtn').classList.remove('active');
  }
  saveState();
});

$('viewBtn').addEventListener('click', () => {
  if (!running) return;
  viewMode = viewMode === 'art' ? 'params' : 'art';
  $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
  renderCells();
  // Re-apply listening state
  const cells = document.querySelectorAll('.cell');
  cells.forEach((cell, i) => cell.classList.toggle('listening', i === currentListening));
  saveState();
});

$('fadeSlider').addEventListener('input', () => {
  fadeTime = parseFloat($('fadeSlider').value);
  saveState();
});

$('dwellSlider').addEventListener('input', () => {
  dwellTime = parseFloat($('dwellSlider').value);
  if (!paused) startCycling();
  saveState();
});

$('saveBtn').addEventListener('click', () => {
  if (!running) return;
  const data = JSON.stringify({
    variations, currentListening, paused, viewMode, fadeTime, dwellTime, root, voiceSeed
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `drone-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

$('loadBtn').addEventListener('click', () => {
  $('loadFile').click();
});

$('loadFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const s = JSON.parse(ev.target.result);
      if (!s || !s.variations || s.variations.length !== NUM_CELLS) return;
      // Files saved before the engine rewrite have no root/seed and old
      // param names; they keep the current root and play on the new engine.
      variations = migrateVariations(s.variations);
      currentListening = s.currentListening || 0;
      if (s.root) root = s.root;
      if (s.voiceSeed) voiceSeed = s.voiceSeed;
      paused = s.paused || false;
      viewMode = s.viewMode || 'art';
      fadeTime = s.fadeTime || 3;
      dwellTime = s.dwellTime || 12;
      saveState();
      if (running) {
        buildGrid();
        startEngine();
        clearInterval(cycleTimer);
        if (!paused) startCycling();
        $('pauseBtn').textContent = paused ? 'cycle' : 'pause';
        $('pauseBtn').classList.toggle('active', paused);
        $('viewBtn').textContent = viewMode === 'art' ? 'params' : 'art';
        $('fadeSlider').value = fadeTime;
        $('dwellSlider').value = dwellTime;
      }
    } catch(err) {}
    e.target.value = '';
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
